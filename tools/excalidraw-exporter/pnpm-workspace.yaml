packages:
  - .
  - stubs/*

autoInstallPeers: false

overrides:
  "@excalidraw/mermaid-to-excalidraw": file:./stubs/mermaid-to-excalidraw
  # Excalidraw ships compiled CSS; its Sass build dependency is unused here.
  "@excalidraw/excalidraw@0.18.1>sass": "-"
  nanoid@3.3.3: 3.3.20

minimumReleaseAge: 10080

strictDepBuilds: true

allowBuilds:
  core-js: false
  core-js-pure: false
